<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shani Dudovitch – Coming soon</title>
  <meta name="description" content="Designing new ways to see. A new portfolio by Shani Dudovitch is on its way.">
  <!-- Fonts from Google Fonts: Geist (text), Instrument Serif Italic (one special word), IBM Plex Mono (small details) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;600&family=IBM+Plex+Mono&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <span class="name" data-cursor="Glad you’re here">Shani Dudovitch</span>
    <span class="muted" data-cursor="Psst…">Portfolio ©2026</span>
    <span class="serif header-status">Coming soon</span>
  </header>

  <main>
    <!-- The word in .swap-word changes every few seconds (see script.js) -->
    <h1 class="headline">
      <span class="headline-strong">Designing</span> new ways<br>
      to <span class="swap-word serif" aria-live="polite">see</span>.
    </h1>
    <p class="subtitle muted">A new portfolio is on its way — <br>UX/UI, branding and product design.</p>
  </main>

  <footer class="site-footer">
    <span class="mono muted" data-cursor="Almost there">Launching 30.11.2026</span>
    <!-- Click: opens the mail app and also copies the address (see script.js) -->
    <a class="link underline email-link" data-cursor="Say hello" href="mailto:Shanidudovitch2044@gmail.com">Shanidudovitch2044@gmail.com</a>
    <!-- TODO: replace # with Shani's LinkedIn profile address -->
    <a class="link" data-cursor="Let’s connect" href="#" target="_blank" rel="noopener">LinkedIn ↗</a>
    <span class="mono muted" data-cursor="I can’t wait">Hellooo, it’s closer than ever.</span>
  </footer>

  <!-- Images from the work follow the mouse here as one smooth chain (see script.js) -->
  <div class="trail" aria-hidden="true"></div>

  <!-- Custom cursor: says "Coming soon", and talks to the visitor on the top and bottom bars -->
  <div class="cursor serif" aria-hidden="true"><span class="cursor-text">Coming soon</span></div>

  <script src="script.js"></script>
</body>
</html>
